# Gradle Settings
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx2048M
org.gradle.parallel=true

# [Customize] Maven Metadata
archives_base_name=sparklib
maven_group=io.github.erha134

# [Customize] Mod Metadata
mod_id=sparklib
mod_version=1.0.2
mod_name=Spark Lib
mod_description=A library Minecraft mod provides powerful tools.
mod_home_page=https://erha134.github.io
mod_sources_page=https://github.com/erha134/SparkLib
mod_license=Apache-2.0

# Auto Update from `mod_sources_page`, Change it if nessary.
mod_issues_page=

# Minecraft Settings
enabled_platforms=fabric,forge,neoforge
minecraft_version=1.20.4
yarn_mappings=1.20.4+build.3

# Fabric
fabric_minecraft_dependency=>=1.20.2 <1.20.5
fabric_loader_version=0.16.10
fabric_api_version=0.97.2+1.20.4

# Forge
forge_minecraft_dependency=[1.20.2, 1.20.5)
fml_dependency=[48, )
forge_version=49.1.29

# NeoForge
neoforge_minecraft_dependency=[1.20.2, 1.20.5)
neoforge_fml_dependency=[20.2, )
neoforge_version=20.4.239

# [Optional] Mixin Extras
# mixinextras_version=0.4.1

# Mod dependencies
architectury_version=11.1.17

# [Optional] Mod Menu
# modmenu_version=7.2.2

# [Optional] LazyDFU
# lazydfu_version=0.1.3

# Other dependencies
jsr305_version=3.0.2
lombok_version=1.18.34
apache_maven_artifact_version=3.8.5
easylib_version=1.0.0-beta.3
sparkconfig_version=1.0.1-fix.1
